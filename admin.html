  <style>

<body>

  <!-- PAGE LOADING -->

  <div
    id="pageLoading"
    style="
      position:fixed;
      inset:0;
      background:#f5f5f5;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      font-weight:bold;
      z-index:9999;
    "
  >
    Checking admin session...
  </div>


  <!-- LOGIN -->

  <div id="loginBox" style="display:none;">

    <h2 style="margin-bottom:20px;">
      🔐 KravinZo Admin Login
    </h2>

    <input
      type="text"
      id="adminUsername"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      type="password"
      id="adminPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Login
    </button>

    <p id="loginError"></p>

  </div>


  <!-- ADMIN PAGE -->

  <div id="adminPage" style="display:none;">

    <h1>🍔 KravinZo Admin</h1>

    <button
      class="logout-btn"
      id="logoutButton"
    >
      Logout
    </button>

    <div id="orders">

      <div class="empty">
        Loading orders...
      </div>

    </div>

  </div>


  <script>

    // ==========================================
    // GLOBAL VARIABLES
    // ==========================================

    let kravinZoAudioCtx = null;

    let lastOrderId =
      localStorage.getItem("kravinzoLastOrderId") || null;


    // ==========================================
    // SHOW LOGIN
    // ==========================================

    function showLogin() {

      document.getElementById("pageLoading").style.display =
        "none";

      document.getElementById("loginBox").style.display =
        "block";

      document.getElementById("adminPage").style.display =
        "none";
    }


    // ==========================================
    // SHOW ADMIN
    // ==========================================

    function showAdmin() {

      document.getElementById("pageLoading").style.display =
        "none";

      document.getElementById("loginBox").style.display =
        "none";

      document.getElementById("adminPage").style.display =
        "block";
    }


    // ==========================================
    // SOUND UNLOCK
    // ==========================================

    function unlockKravinZoSound() {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) return;

      if (!kravinZoAudioCtx) {
        kravinZoAudioCtx =
          new AudioContext();
      }

      if (kravinZoAudioCtx.state === "suspended") {
        kravinZoAudioCtx.resume();
      }
    }


    // ==========================================
    // NEW ORDER SOUND
    // ==========================================

    function playKravinZoSound() {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) return;

      if (!kravinZoAudioCtx) {
        kravinZoAudioCtx =
          new AudioContext();
      }

      const ctx = kravinZoAudioCtx;

      const playRestaurantBell = () => {

        const start = ctx.currentTime;

        const compressor =
          ctx.createDynamicsCompressor();

        compressor.threshold.setValueAtTime(
          -18,
          start
        );

        compressor.knee.setValueAtTime(
          8,
          start
        );

        compressor.ratio.setValueAtTime(
          5,
          start
        );

        compressor.attack.setValueAtTime(
          0.003,
          start
        );

        compressor.release.setValueAtTime(
          0.15,
          start
        );

        compressor.connect(ctx.destination);


        for (let r = 0; r < 3; r++) {

          const t =
            start + (r * 2);


          // MAIN BELL

          const osc1 =
            ctx.createOscillator();

          const gain1 =
            ctx.createGain();

          osc1.type = "sine";

          osc1.frequency.setValueAtTime(
            760,
            t
          );

          osc1.frequency.exponentialRampToValueAtTime(
            680,
            t + 1.35
          );

          gain1.gain.setValueAtTime(
            0.001,
            t
          );

          gain1.gain.exponentialRampToValueAtTime(
            0.9,
            t + 0.015
          );

          gain1.gain.exponentialRampToValueAtTime(
            0.001,
            t + 1.5
          );

          osc1.connect(gain1);
          gain1.connect(compressor);

          osc1.start(t);
          osc1.stop(t + 1.55);


          // BRIGHT DING

          const osc2 =
            ctx.createOscillator();

          const gain2 =
            ctx.createGain();

          osc2.type = "sine";

          osc2.frequency.setValueAtTime(
            1520,
            t
          );

          osc2.frequency.exponentialRampToValueAtTime(
            1320,
            t + 1.25
          );

          gain2.gain.setValueAtTime(
            0.001,
            t
          );

          gain2.gain.exponentialRampToValueAtTime(
            0.55,
            t + 0.01
          );

          gain2.gain.exponentialRampToValueAtTime(
            0.001,
            t + 1.35
          );

          osc2.connect(gain2);
          gain2.connect(compressor);

          osc2.start(t);
          osc2.stop(t + 1.4);


          // HIGH SPARKLE

          const osc3 =
            ctx.createOscillator();

          const gain3 =
            ctx.createGain();

          osc3.type = "sine";

          osc3.frequency.setValueAtTime(
            2280,
            t
          );

          gain3.gain.setValueAtTime(
            0.001,
            t
          );

          gain3.gain.exponentialRampToValueAtTime(
            0.18,
            t + 0.008
          );

          gain3.gain.exponentialRampToValueAtTime(
            0.001,
            t + 0.9
          );

          osc3.connect(gain3);
          gain3.connect(compressor);

          osc3.start(t);
          osc3.stop(t + 1);
        }
      };


      if (ctx.state === "suspended") {

        ctx.resume().then(() => {
          playRestaurantBell();
        });

      } else {

        playRestaurantBell();

      }
    }


    // ==========================================
    // ADMIN LOGIN
    // ==========================================

    async function adminLogin() {

      const username =
        document
          .getElementById("adminUsername")
          .value
          .trim();

      const password =
        document
          .getElementById("adminPassword")
          .value;

      const error =
        document.getElementById("loginError");

      error.textContent = "";


      if (!username || !password) {

        error.textContent =
          "Please enter username and password.";

        return;
      }


      try {

        const response =
          await fetch(
            "/api/admin-login",
            {
              method: "POST",

              credentials: "include",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                username: username,
                password: password
              })
            }
          );


        const data =
          await response.json();


        if (data.success) {

          unlockKravinZoSound();

          showAdmin();

          await loadOrders();

        } else {

          error.textContent =
            data.error ||
            "Invalid username or password.";

        }


      } catch (err) {

        console.error(
          "Login error:",
          err
        );

        error.textContent =
          "Login failed. Please try again.";

      }
    }


    // ==========================================
    // CHECK ADMIN SESSION
    // ==========================================

    async function checkAdminSession() {

      try {

        const response =
          await fetch(
            "/api/get-orders",
            {
              method: "GET",
              credentials: "include",
              cache: "no-store"
            }
          );


        if (response.ok) {

          showAdmin();

          await loadOrders();

          return;
        }


        showLogin();


      } catch (error) {

        console.error(
          "Session check failed:",
          error
        );

        showLogin();

      }
    }


    // ==========================================
    // LOAD ORDERS
    // ==========================================

    async function loadOrders() {

      const ordersContainer =
        document.getElementById("orders");


      try {

        const response =
          await fetch(
            "/api/get-orders",
            {
              method: "GET",
              credentials: "include",
              cache: "no-store"
            }
          );


        // SESSION EXPIRED

        if (response.status === 401) {

          showLogin();

          return;
        }


        const responseText =
          await response.text();

        let data;


        try {

          data =
            JSON.parse(responseText);

        } catch (error) {

          console.error(
            "Invalid JSON:",
            responseText
          );

          ordersContainer.innerHTML =
            '<div class="empty">Server returned invalid response.</div>';

          return;
        }


        if (!response.ok) {

          ordersContainer.innerHTML =
            '<div class="empty">Failed to load orders.</div>';

          return;
        }


        // NO ORDERS

        if (
          !data.success ||
          !Array.isArray(data.orders) ||
          data.orders.length === 0
        ) {

          ordersContainer.innerHTML =
            '<div class="empty">No orders found.</div>';

          return;
        }


        // ==========================================
        // NEW ORDER DETECTION
        // ==========================================

        const latestOrder =
          data.orders[0];

        const latestOrderId =
          latestOrder?.order_id;


        if (
          lastOrderId &&
          latestOrderId &&
          latestOrderId !== lastOrderId
        ) {

          console.log(
            "🔔 NEW KRAVINZO ORDER:",
            latestOrderId
          );

          playKravinZoSound();
        }


        if (latestOrderId) {

          lastOrderId =
            latestOrderId;

          localStorage.setItem(
            "kravinzoLastOrderId",
            latestOrderId
          );
        }


        // CLEAR ORDERS

        ordersContainer.innerHTML = "";


        // ==========================================
        // DISPLAY ORDERS
        // ==========================================

        data.orders.forEach(order => {

          const card =
            document.createElement("div");

          card.className =
            "order-card";


          // ==========================================
          // ITEMS
          // ==========================================

          let itemsHTML =
            "Unable to read items";


          try {

            let items =
              order.items;


            if (typeof items === "string") {

              items =
                JSON.parse(items);

            }


            if (Array.isArray(items)) {

              itemsHTML =
                items
                  .map(item => {

                    const name =
                      item.name || "Item";

                    const quantity =
                      item.quantity || 1;

                    const itemTotal =
                      item.itemTotal ??
                      item.total ??
                      0;


                    return `
                      <div style="margin:6px 0;">
                        ${name}
                        × ${quantity}
                        — ₹${itemTotal}
                      </div>
                    `;

                  })
                  .join("");

            }

          } catch (error) {

            console.error(
              "Items parse error:",
              error
            );

          }


          // ==========================================
          // GOOGLE MAP
          // ==========================================

          let mapUrl = null;

          let mapButtonHTML = "";


          if (
            order.customer_address &&
            order.customer_address.includes("Google Maps:")
          ) {

            mapUrl =
              order.customer_address
                .split("Google Maps:")[1]
                .trim();


            mapButtonHTML = `
              <button class="map-btn">
                📍 Open Google Maps
              </button>
            `;

          }


          // ==========================================
          // CURRENT STATUS
          // ==========================================

          const currentStatus =
            order.status || "Order Confirmed";


          // ==========================================
          // ORDER CARD
          // ==========================================

          card.innerHTML = `

            <h3>
              Order #${order.order_id}
            </h3>


            <p style="margin-bottom:8px;">
              <strong>🕐 Order Time:</strong>
              ${
                order.created_at
                  ? new Date(
                      order.created_at
                    ).toLocaleString(
                      "en-IN",
                      {
                        day: "2-digit",
                        month: "short",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                        hour12: true
                      }
                    )
                  : "N/A"
              }
            </p>


            <p style="margin-bottom:8px;">
              <strong>Customer:</strong>
              ${order.customer_name || "N/A"}
            </p>


            <p style="margin-bottom:8px;">
              <strong>Phone:</strong>
              ${order.customer_phone || "N/A"}
            </p>


            <p style="margin-bottom:8px;">
              <strong>Address:</strong>
              ${order.customer_address || "N/A"}
            </p>


            ${mapButtonHTML}


            <p style="margin-top:10px;">
              <strong>Total:</strong>
              ₹${order.total || 0}
            </p>


            <p style="margin-top:10px;">
              <strong>Items:</strong>
            </p>


            <div class="items">
              ${itemsHTML}
            </div>


            <div class="status status-current">
              📦 Current Status:
              ${currentStatus}
            </div>


            <div class="status-buttons">

              ${
                currentStatus === "Order Confirmed" ||
                currentStatus === "pending"
                  ? `
                    <button class="preparing-btn">
                      🍳 Preparing Food
                    </button>
                  `
                  : ""
              }


              ${
                currentStatus === "Preparing Food"
                  ? `
                    <button class="ready-btn">
                      ✅ Food Ready
                    </button>
                  `
                  : ""
              }


              ${
                currentStatus === "Food Ready"
                  ? `
                    <button class="delivery-btn">
                      🛵 Handed to Delivery
                    </button>
                  `
                  : ""
              }


              ${
                currentStatus === "Handed to Delivery"
                  ? `
                    <button class="delivered-btn">
                      🎉 Delivered
                    </button>
                  `
                  : ""
              }


              ${
                currentStatus === "Delivered"
                  ? `
                    <strong style="color:green;">
                      ✅ Order Completed
                    </strong>
                  `
                  : ""
              }

            </div>

          `;


          // ==========================================
          // GOOGLE MAP BUTTON
          // ==========================================

          if (mapUrl) {

            const mapButton =
              card.querySelector(".map-btn");


            if (mapButton) {

              mapButton.addEventListener(
                "click",
                () => {
                  openMap(mapUrl);
                }
              );

            }
          }


          // ==========================================
          // PREPARING
          // ==========================================

          const preparingButton =
            card.querySelector(".preparing-btn");


          if (preparingButton) {

            preparingButton.addEventListener(
              "click",
              () => {

                updateStatus(
                  order.order_id,
                  "Preparing Food"
                );

              }
            );

          }


          // ==========================================
          // FOOD READY
          // ==========================================

          const readyButton =
            card.querySelector(".ready-btn");


          if (readyButton) {

            readyButton.addEventListener(
              "click",
              () => {

                updateStatus(
                  order.order_id,
                  "Food Ready"
                );

              }
            );

          }


          // ==========================================
          // HANDED TO DELIVERY
          // ==========================================

          const deliveryButton =
            card.querySelector(".delivery-btn");


          if (deliveryButton) {

            deliveryButton.addEventListener(
              "click",
              () => {

                updateStatus(
                  order.order_id,
                  "Handed to Delivery"
                );

              }
            );

          }


          // ==========================================
          // DELIVERED
          // ==========================================

          const deliveredButton =
            card.querySelector(".delivered-btn");


          if (deliveredButton) {

            deliveredButton.addEventListener(
              "click",
              () => {

                updateStatus(
                  order.order_id,
                  "Delivered"
                );

              }
            );

          }


          ordersContainer.appendChild(card);

        });


      } catch (error) {

        console.error(
          "Load orders error:",
          error
        );

        ordersContainer.innerHTML =
          '<div class="empty">Failed to load orders.</div>';

      }
    }


    // ==========================================
    // GOOGLE MAP
    // ==========================================

    function openMap(url) {

      if (!url) return;

      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    }


    // ==========================================
    // UPDATE ORDER STATUS
    // ==========================================

    async function updateStatus(
      orderId,
      status
    ) {

      try {

        const response =
          await fetch(
            "/api/update-order-status",
            {
              method: "POST",

              credentials: "include",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                orderId: orderId,
                status: status
              })
            }
          );


        const responseText =
          await response.text();


        console.log(
          "STATUS API RESPONSE:",
          response.status
        );


        console.log(
          "STATUS API BODY:",
          responseText
        );


        let data;


        try {

          data =
            JSON.parse(responseText);

        } catch (jsonError) {

          alert(
            "Server Error (" +
            response.status +
            "):\n\n" +
            responseText
          );

          return;
        }


        // SESSION EXPIRED

        if (response.status === 401) {

          showLogin();

          return;
        }


        // SUCCESS

        if (
          response.ok &&
          data.success
        ) {

          await loadOrders();

          return;
        }


        // ERROR

        alert(
          data.error ||
          data.message ||
          "Failed to update status"
        );


      } catch (error) {

        console.error(
          "Update status error:",
          error
        );


        alert(
          "Connection error:\n\n" +
          error.message
        );

      }
    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logoutAdmin() {

      try {

        await fetch(
          "/api/admin-logout",
          {
            method: "POST",
            credentials: "include"
          }
        );

      } catch (error) {

        console.error(
          "Logout error:",
          error
        );

      }


      showLogin();

    }


    // ==========================================
    // LOGIN BUTTON
    // ==========================================

    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        adminLogin
      );


    // ==========================================
    // ENTER KEY LOGIN
    // ==========================================

    document
      .getElementById("adminPassword")
      .addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter") {

            adminLogin();

          }

        }
      );


    // ==========================================
    // LOGOUT BUTTON
    // ==========================================

    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        logoutAdmin
      );


    // ==========================================
    // AUTO REFRESH - 15 SECONDS
    // ==========================================

    setInterval(
      async () => {

        const adminPage =
          document.getElementById("adminPage");


        if (
          adminPage &&
          adminPage.style.display !== "none"
        ) {

          await loadOrders();

        }

      },
      15000
    );


    // ==========================================
    // UNLOCK SOUND
    // ==========================================

    document.addEventListener(
      "click",
      unlockKravinZoSound
    );


    document.addEventListener(
      "keydown",
      unlockKravinZoSound
    );


    // ==========================================
    // START
    // ==========================================

    checkAdminSession();

  </script>

</body>
</html>
```
