<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KravinZo Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .order-card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .order-card h3 {
      margin-bottom: 10px;
    }

    .status {
      display: inline-block;
      margin: 10px 0;
      padding: 8px 12px;
      border-radius: 20px;
      background: #eee;
      font-weight: bold;
    }

    button {
      padding: 10px 15px;
      margin: 5px 5px 0 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #111;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    #orders {
      max-width: 700px;
    }

    .empty {
      background: white;
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>🍔 KravinZo Admin</h1>

  <div id="orders">
    <div class="empty">Loading orders...</div>
  </div>

  <script>
    async function loadOrders() {
      const ordersContainer = document.getElementById("orders");

      try {
        const response = await fetch("/api/get-orders");

        const data = await response.json();

        if (!data.success || !data.orders || data.orders.length === 0) {
          ordersContainer.innerHTML =
            '<div class="empty">No orders found.</div>';
          return;
        }

        ordersContainer.innerHTML = "";

        data.orders.forEach(order => {

          const card = document.createElement("div");
          card.className = "order-card";

          card.innerHTML = `
            <h3>Order #${order.id}</h3>

            <p><strong>Customer:</strong> ${order.customer_name || "N/A"}</p>
            <p><strong>Phone:</strong> ${order.phone || "N/A"}</p>
            <p><strong>Address:</strong> ${order.address || "N/A"}</p>
            <p><strong>Total:</strong> ₹${order.total || 0}</p>

            <div class="status">
              ${order.status || "Order Placed"}
            </div>

            <br>

            <button onclick="updateStatus('${order.id}', 'Preparing Food')">
              Preparing Food
            </button>

            <button onclick="updateStatus('${order.id}', 'Food Ready')">
              Food Ready
            </button>

            <button onclick="updateStatus('${order.id}', 'Handed to Delivery')">
              Handed to Delivery
            </button>

            <button onclick="updateStatus('${order.id}', 'Delivered')">
              Delivered
            </button>
          `;

          ordersContainer.appendChild(card);
        });

      } catch (error) {
        console.error(error);

        ordersContainer.innerHTML =
          '<div class="empty">Failed to load orders.</div>';
      }
    }


    async function updateStatus(orderId, status) {

      try {

        const response = await fetch("/api/update-order-status", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            orderId: orderId,
            status: status
          })
        });

        const data = await response.json();

        if (data.success) {
          alert("Order status updated!");
          loadOrders();
        } else {
          alert(data.error || "Failed to update status");
        }

      } catch (error) {

        console.error(error);
        alert("Something went wrong");

      }
    }

    loadOrders();
  </script>

</body>
</html>
