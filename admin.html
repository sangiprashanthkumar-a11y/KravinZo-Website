<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KravinZo Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
      padding: 20px;
    }

    /* ==========================================
       PAGE LOADING
    ========================================== */

    #pageLoading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* ==========================================
       LOGIN
    ========================================== */

    #loginBox {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    #loginBox h2 {
      text-align: center;
      margin-bottom: 22px;
    }

    #loginBox input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    #loginBox input:focus {
      border-color: #ff6b00;
    }

    #loginButton {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #loginButton:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #loginError {
      color: red;
      text-align: center;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* ==========================================
       ADMIN
    ========================================== */

    #adminPage {
      max-width: 800px;
      margin: auto;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .admin-title {
      font-size: 30px;
      font-weight: 800;
    }

    .logout-btn {
      border: none;
      background: #d32f2f;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .refresh-text {
      color: #777;
      font-size: 13px;
      margin-bottom: 18px;
    }

    /* ==========================================
       ORDER CARD
    ========================================== */

    .order-card {
      background: white;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.08);
    }

    .order-card h3 {
      font-size: 19px;
      margin-bottom: 15px;
      word-break: break-word;
    }

    .order-info {
      margin-bottom: 8px;
      line-height: 1.5;
      word-break: break-word;
    }

    .items-title {
      margin-top: 14px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .item {
      padding: 5px 0;
      border-bottom: 1px dashed #eee;
    }

    .item:last-child {
      border-bottom: none;
    }

    /* ==========================================
       MAP
    ========================================== */

    .map-btn {
      border: none;
      padding: 10px 14px;
      margin-top: 5px;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* ==========================================
       STATUS
    ========================================== */

    .status {
      display: inline-block;
      margin-top: 15px;
      padding: 9px 14px;
      border-radius: 20px;
      background: #eee;
      font-weight: bold;
    }

    .status-new {
      background: #fff3cd;
    }

    .status-preparing {
      background: #ffe0b2;
    }

    .status-ready {
      background: #c8e6c9;
    }

    .status-delivery {
      background: #bbdefb;
    }

    .status-delivered {
      background: #d7ffd9;
    }

    /* ==========================================
       STATUS BUTTONS
    ========================================== */

    .status-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .status-buttons button {
      border: none;
      color: white;
      padding: 11px 15px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .status-buttons button:hover {
      opacity: .85;
    }

    .status-buttons button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .preparing-btn {
      background: #f57c00;
    }

    .ready-btn {
      background: #2e7d32;
    }

    .delivery-btn {
      background: #1976d2;
    }

    .delivered-btn {
      background: #7b1fa2;
    }

    .completed {
      display: block;
      color: #2e7d32;
      font-weight: bold;
      margin-top: 12px;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      color: #666;
    }

    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .admin-title {
        font-size: 24px;
      }

      .order-card {
        padding: 16px;
      }

      .status-buttons {
        display: grid;
        grid-template-columns: 1fr;
      }

      .status-buttons button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- ==========================================
       LOADING
  ========================================== -->

  <div id="pageLoading">
    Checking admin session...
  </div>


  <!-- ==========================================
       LOGIN
  ========================================== -->

  <div id="loginBox" style="display:none;">

    <h2>
      🔐 KravinZo Admin Login
    </h2>

    <input
      id="adminUsername"
      type="text"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      id="adminPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Login
    </button>

    <p id="loginError"></p>

  </div>


  <!-- ==========================================
       ADMIN PAGE
  ========================================== -->

  <div id="adminPage" style="display:none;">

    <div class="admin-header">

      <div class="admin-title">
        🍔 KravinZo Admin
      </div>

      <button
        id="logoutButton"
        class="logout-btn"
      >
        Logout
      </button>

    </div>

    <div class="refresh-text">
      🔄 Orders auto-refresh every 10 seconds
    </div>

    <div id="orders">

      <div class="empty">
        Loading orders...
      </div>

    </div>

  </div>


  <script>

    // ==========================================
    // GLOBAL
    // ==========================================

    let audioContext = null;

    let lastOrderId =
      localStorage.getItem(
        "kravinzoLastOrderId"
      ) || null;


    // ==========================================
    // SHOW LOGIN
    // ==========================================

    function showLogin() {

      document.getElementById(
        "pageLoading"
      ).style.display = "none";

      document.getElementById(
        "loginBox"
      ).style.display = "block";

      document.getElementById(
        "adminPage"
      ).style.display = "none";

    }


    // ==========================================
    // SHOW ADMIN
    // ==========================================

    function showAdmin() {

      document.getElementById(
        "pageLoading"
      ).style.display = "none";

      document.getElementById(
        "loginBox"
      ).style.display = "none";

      document.getElementById(
        "adminPage"
      ).style.display = "block";

    }


    // ==========================================
    // UNLOCK AUDIO
    // ==========================================

    function unlockSound() {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) {
        return;
      }

      if (!audioContext) {

        audioContext =
          new AudioContext();

      }

      if (
        audioContext.state ===
        "suspended"
      ) {

        audioContext.resume();

      }

    }


    // ==========================================
    // NEW ORDER ALARM
    // ==========================================

    function playNewOrderAlarm() {

      unlockSound();

      if (!audioContext) {
        return;
      }

      const ctx =
        audioContext;

      const playBell = () => {

        const start =
          ctx.currentTime;

        const compressor =
          ctx.createDynamicsCompressor();

        compressor.threshold.setValueAtTime(
          -20,
          start
        );

        compressor.knee.setValueAtTime(
          8,
          start
        );

        compressor.ratio.setValueAtTime(
          6,
          start
        );

        compressor.attack.setValueAtTime(
          0.002,
          start
        );

        compressor.release.setValueAtTime(
          0.2,
          start
        );

        compressor.connect(
          ctx.destination
        );


        // 3 BELLS = APPROX 6 SEC

        for (
          let i = 0;
          i < 3;
          i++
        ) {

          const t =
            start + i * 2;


          // MAIN BELL

          const osc1 =
            ctx.createOscillator();

          const gain1 =
            ctx.createGain();

          osc1.type =
            "sine";

          osc1.frequency.setValueAtTime(
            880,
            t
          );

          osc1.frequency.exponentialRampToValueAtTime(
            700,
            t + 1.4
          );

          gain1.gain.setValueAtTime(
            0.001,
            t
          );

          gain1.gain.exponentialRampToValueAtTime(
            0.9,
            t + 0.01
          );

          gain1.gain.exponentialRampToValueAtTime(
            0.001,
            t + 1.6
          );

          osc1.connect(gain1);

          gain1.connect(
            compressor
          );

          osc1.start(t);

          osc1.stop(
            t + 1.7
          );


          // HIGH BELL

          const osc2 =
            ctx.createOscillator();

          const gain2 =
            ctx.createGain();

          osc2.type =
            "sine";

          osc2.frequency.setValueAtTime(
            1760,
            t
          );

          gain2.gain.setValueAtTime(
            0.001,
            t
          );

          gain2.gain.exponentialRampToValueAtTime(
            0.45,
            t + 0.01
          );

          gain2.gain.exponentialRampToValueAtTime(
            0.001,
            t + 1.2
          );

          osc2.connect(gain2);

          gain2.connect(
            compressor
          );

          osc2.start(t);

          osc2.stop(
            t + 1.3
          );

        }

      };


      if (
        ctx.state ===
        "suspended"
      ) {

        ctx.resume().then(
          playBell
        );

      } else {

        playBell();

      }

    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function adminLogin() {

      const username =
        document
          .getElementById(
            "adminUsername"
          )
          .value
          .trim();

      const password =
        document
          .getElementById(
            "adminPassword"
          )
          .value;

      const errorBox =
        document.getElementById(
          "loginError"
        );

      const loginButton =
        document.getElementById(
          "loginButton"
        );

      errorBox.textContent =
        "";


      if (
        !username ||
        !password
      ) {

        errorBox.textContent =
          "Please enter username and password.";

        return;

      }


      loginButton.disabled =
        true;

      loginButton.textContent =
        "Logging in...";


      try {

        const response =
          await fetch(
            "/api/admin-login",
            {
              method: "POST",

              credentials:
                "include",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  username:
                    username,

                  password:
                    password
                })
            }
          );


        const text =
          await response.text();

        let data;


        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "Invalid server response"
          );

        }


        if (
          response.ok &&
          data.success
        ) {

          unlockSound();

          showAdmin();

          await loadOrders();

        } else {

          errorBox.textContent =
            data.error ||
            "Invalid username or password.";

        }


      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );

        errorBox.textContent =
          "Login failed: " +
          error.message;

      }


      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

    }


    // ==========================================
    // CHECK SESSION
    // ==========================================

    async function checkSession() {

      try {

        const response =
          await fetch(
            "/api/get-orders",
            {
              method: "GET",
              credentials: "include",
              cache: "no-store"
            }
          );


        if (response.ok) {

          showAdmin();

          await loadOrders();

        } else {

          showLogin();

        }


      } catch (error) {

        console.error(
          "SESSION ERROR:",
          error
        );

        showLogin();

      }

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(value) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        String(
          value ?? ""
        );

      return div.innerHTML;

    }


    // ==========================================
    // LOAD ORDERS
    // ==========================================

    async function loadOrders() {

      const container =
        document.getElementById(
          "orders"
        );


      try {

        const response =
          await fetch(
            "/api/get-orders",
            {
              method: "GET",
              credentials: "include",
              cache: "no-store"
            }
          );


        if (
          response.status === 401
        ) {

          showLogin();

          return;

        }


        const text =
          await response.text();

        let data;


        try {

          data =
            JSON.parse(text);

        } catch {

          container.innerHTML = `
            <div class="empty">
              Invalid server response.
            </div>
          `;

          return;

        }


        if (
          !response.ok ||
          !data.success
        ) {

          container.innerHTML = `
            <div class="empty">
              ${
                escapeHTML(
                  data.error ||
                  "Failed to load orders."
                )
              }
            </div>
          `;

          return;

        }


        if (
          !Array.isArray(
            data.orders
          ) ||
          data.orders.length === 0
        ) {

          container.innerHTML = `
            <div class="empty">
              No orders found.
            </div>
          `;

          return;

        }


        // ======================================
        // NEW ORDER ALARM
        // ======================================

        const latestOrder =
          data.orders[0];

        const latestOrderId =
          latestOrder &&
          latestOrder.order_id;


        if (
          lastOrderId &&
          latestOrderId &&
          latestOrderId !==
            lastOrderId
        ) {

          console.log(
            "🔔 NEW ORDER:",
            latestOrderId
          );

          playNewOrderAlarm();

        }


        if (latestOrderId) {

          lastOrderId =
            latestOrderId;

          localStorage.setItem(
            "kravinzoLastOrderId",
            latestOrderId
          );

        }


        // ======================================
        // DISPLAY ORDERS
        // ======================================

        container.innerHTML =
          "";


        data.orders.forEach(
          order => {

            const card =
              document.createElement(
                "div"
              );

            card.className =
              "order-card";


            // ==================================
            // FALLBACK COLUMN NAMES
            // ==================================

            const phone =
              order.customer_phone ||
              order.phone_number ||
              "N/A";

            const address =
              order.customer_address ||
              order.address ||
              "N/A";

            let items =
              order.items ??
              order.item ??
              [];


            // ==================================
            // ITEMS
            // ==================================

            try {

              if (
                typeof items ===
                "string"
              ) {

                items =
                  JSON.parse(
                    items
                  );

              }

            } catch {

              items = [];

            }


            let itemsHTML =
              "No items";


            if (
              Array.isArray(items) &&
              items.length > 0
            ) {

              itemsHTML =
                items
                  .map(item => {

                    const quantity =
                      Number(
                        item.quantity ||
                        1
                      );

                    const price =
                      Number(
                        item.price ||
                        0
                      );

                    const itemTotal =
                      Number(
                        item.itemTotal ??
                        item.total ??
                        price *
                        quantity
                      );

                    return `
                      <div class="item">
                        ${escapeHTML(
                          item.name ||
                          "Item"
                        )}
                        × ${quantity}
                        — ₹${itemTotal}
                      </div>
                    `;

                  })
                  .join("");

            }


            // ==================================
            // MAP
            // ==================================

            let mapUrl =
              null;


            if (
              typeof address ===
                "string" &&
              address.includes(
                "Google Maps:"
              )
            ) {

              mapUrl =
                address
                  .split(
                    "Google Maps:"
                  )[1]
                  .trim();

            }


            let mapButtonHTML =
              "";


            if (mapUrl) {

              mapButtonHTML = `
                <button class="map-btn">
                  📍 Open Google Maps
                </button>
              `;

            }


            // ==================================
            // CLEAN ADDRESS
            // ==================================

            const cleanAddress =
              String(address)
                .split(
                  "Google Maps:"
                )[0]
                .trim();


            // ==================================
            // CURRENT STATUS
            // ==================================

            const currentStatus =
              String(
                order.status ||
                "New"
              ).trim();


            const statusLower =
              currentStatus
                .toLowerCase();


            let statusClass =
              "status-new";


            if (
              statusLower ===
              "preparing food"
            ) {

              statusClass =
                "status-preparing";

            } else if (
              statusLower ===
              "food ready"
            ) {

              statusClass =
                "status-ready";

            } else if (
              statusLower ===
              "handed to delivery"
            ) {

              statusClass =
                "status-delivery";

            } else if (
              statusLower ===
              "delivered"
            ) {

              statusClass =
                "status-delivered";

            }


            // ==================================
            // ALL 4 STATUS BUTTONS
            // ==================================

            let buttonsHTML = `
              <button
                class="preparing-btn"
                data-status="Preparing Food"
              >
                🍳 Preparing Food
              </button>

              <button
                class="ready-btn"
                data-status="Food Ready"
              >
                ✅ Food Ready
              </button>

              <button
                class="delivery-btn"
                data-status="Handed to Delivery"
              >
                🛵 Handed to Delivery
              </button>

              <button
                class="delivered-btn"
                data-status="Delivered"
              >
                🎉 Delivered
              </button>
            `;


            // ==================================
            // CARD
            // ==================================

            card.innerHTML = `

              <h3>
                Order #${escapeHTML(
                  order.order_id
                )}
              </h3>


              <div class="order-info">

                <strong>
                  🕐 Order Time:
                </strong>

                ${
                  order.created_at
                    ? new Date(
                        order.created_at
                      ).toLocaleString(
                        "en-IN",
                        {
                          day:
                            "2-digit",

                          month:
                            "short",

                          year:
                            "numeric",

                          hour:
                            "2-digit",

                          minute:
                            "2-digit",

                          hour12:
                            true
                        }
                      )
                    : "N/A"
                }

              </div>


              <div class="order-info">

                <strong>
                  Customer:
                </strong>

                ${escapeHTML(
                  order.customer_name ||
                  "N/A"
                )}

              </div>


              <div class="order-info">

                <strong>
                  Phone:
                </strong>

                ${escapeHTML(
                  phone
                )}

              </div>


              <div class="order-info">

                <strong>
                  Address:
                </strong>

                <br>

                ${
                  escapeHTML(
                    cleanAddress
                  ).replace(
                    /\n/g,
                    "<br>"
                  )
                }

              </div>


              ${mapButtonHTML}


              <div
                class="order-info"
                style="margin-top:12px;"
              >

                <strong>
                  Payment:
                </strong>

                ${escapeHTML(
                  order.payment_method ||
                  "N/A"
                )}

              </div>


              <div class="order-info">

                <strong>
                  Total:
                </strong>

                ₹${Number(
                  order.total ||
                  0
                )}

              </div>


              <div class="items-title">
                Items:
              </div>


              <div>
                ${itemsHTML}
              </div>


              <div
                class="status ${statusClass}"
              >

                📦 Current Status:
                ${escapeHTML(
                  currentStatus
                )}

              </div>


              <div class="status-buttons">

                ${buttonsHTML}

              </div>


              ${
                statusLower ===
                "delivered"
                  ? `
                    <span class="completed">
                      ✅ Order Completed
                    </span>
                  `
                  : ""
              }

            `;


            // ==================================
            // MAP CLICK
            // ==================================

            if (mapUrl) {

              const mapButton =
                card.querySelector(
                  ".map-btn"
                );

              if (mapButton) {

                mapButton.addEventListener(
                  "click",
                  () => {

                    window.open(
                      mapUrl,
                      "_blank",
                      "noopener,noreferrer"
                    );

                  }
                );

              }

            }


            // ==================================
            // STATUS BUTTON EVENTS
            // ==================================

            const statusButtons =
              card.querySelectorAll(
                ".status-buttons button"
              );


            statusButtons.forEach(
              button => {

                const newStatus =
                  button.dataset.status;


                // CURRENT STATUS BUTTON DISABLED

                if (
                  newStatus ===
                  currentStatus
                ) {

                  button.disabled =
                    true;

                }


                button.addEventListener(
                  "click",
                  async () => {

                    const oldText =
                      button.textContent;


                    button.disabled =
                      true;

                    button.textContent =
                      "Updating...";


                    const success =
                      await updateStatus(
                        order.order_id,
                        newStatus
                      );


                    if (!success) {

                      button.disabled =
                        false;

                      button.textContent =
                        oldText;

                    }

                  }
                );

              }
            );


            container.appendChild(
              card
            );

          }
        );


      } catch (error) {

        console.error(
          "LOAD ORDERS ERROR:",
          error
        );


        container.innerHTML = `
          <div class="empty">
            Failed to load orders.
          </div>
        `;

      }

    }


    // ==========================================
    // UPDATE STATUS
    // ==========================================

    async function updateStatus(
      orderId,
      status
    ) {

      try {

        const response =
          await fetch(
            "/api/update-status",
            {
              method: "POST",

              credentials:
                "include",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  orderId:
                    orderId,

                  status:
                    status
                })
            }
          );


        const text =
          await response.text();


        console.log(
          "UPDATE STATUS:",
          response.status,
          text
        );


        let data;


        try {

          data =
            JSON.parse(text);

        } catch {

          alert(
            "Invalid server response:\n\n" +
            text
          );

          return false;

        }


        if (
          response.status === 401
        ) {

          alert(
            "Admin session expired. Please login again."
          );

          showLogin();

          return false;

        }


        if (
          !response.ok ||
          !data.success
        ) {

          alert(
            data.error ||
            data.message ||
            "Status update failed."
          );

          return false;

        }


        await loadOrders();

        return true;


      } catch (error) {

        console.error(
          "UPDATE ERROR:",
          error
        );


        alert(
          "Connection error:\n" +
          error.message
        );

        return false;

      }

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logoutAdmin() {

      try {

        await fetch(
          "/api/admin-logout",
          {
            method: "POST",
            credentials:
              "include"
          }
        );

      } catch (error) {

        console.error(
          "LOGOUT ERROR:",
          error
        );

      }


      showLogin();

    }


    // ==========================================
    // LOGIN BUTTON
    // ==========================================

    document
      .getElementById(
        "loginButton"
      )
      .addEventListener(
        "click",
        adminLogin
      );


    // ==========================================
    // ENTER KEY LOGIN
    // ==========================================

    document
      .getElementById(
        "adminPassword"
      )
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter"
          ) {

            adminLogin();

          }

        }
      );


    // ==========================================
    // LOGOUT BUTTON
    // ==========================================

    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        logoutAdmin
      );


    // ==========================================
    // AUDIO UNLOCK
    // ==========================================

    document.addEventListener(
      "click",
      unlockSound
    );


    document.addEventListener(
      "keydown",
      unlockSound
    );


    // ==========================================
    // AUTO REFRESH EVERY 10 SEC
    // ==========================================

    setInterval(
      async () => {

        const adminPage =
          document.getElementById(
            "adminPage"
          );


        if (
          adminPage &&
          adminPage.style.display !==
            "none"
        ) {

          await loadOrders();

        }

      },
      10000
    );


    // ==========================================
    // START
    // ==========================================

    checkSession();

  </script>

</body>
</html>
