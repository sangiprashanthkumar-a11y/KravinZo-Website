<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KravinZo Delivery GPS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #e63946;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #e63946;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #f1f1f1;
      line-height: 1.7;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .location {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚴 KravinZo</h1>

    <p class="subtitle">
      Delivery Boy GPS Tracking
    </p>

    <label for="orderId">
      Order ID
    </label>

    <input
      type="text"
      id="orderId"
      placeholder="Example: KZ-1788864766739"
    >

    <button id="startBtn" onclick="startTracking()">
      📍 Start Delivery Tracking
    </button>

    <div class="status" id="statusBox">
      Enter Order ID and start tracking.
    </div>

  </div>

  <script>

    let watchId = null;

    function startTracking() {

      const orderId =
        document.getElementById("orderId").value.trim();

      const statusBox =
        document.getElementById("statusBox");

      const startBtn =
        document.getElementById("startBtn");

      if (!orderId) {

        statusBox.innerHTML =
          '<span class="error">Please enter Order ID.</span>';

        return;
      }

      if (!navigator.geolocation) {

        statusBox.innerHTML =
          '<span class="error">GPS is not supported on this device.</span>';

        return;
      }

      startBtn.disabled = true;

      statusBox.innerHTML =
        "📍 Getting your GPS location...";

      watchId = navigator.geolocation.watchPosition(

        async function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;

          statusBox.innerHTML = `
            <span class="success">
              🟢 GPS Tracking Active
            </span>

            <div class="location">
              <b>Order:</b> ${orderId}<br>
              <b>Latitude:</b> ${latitude}<br>
              <b>Longitude:</b> ${longitude}<br>
              <b>Accuracy:</b> ${Math.round(accuracy)} meters<br>
              <b>Last Update:</b> ${new Date().toLocaleTimeString()}
            </div>
          `;

          try {

            const response = await fetch(
              "/api/update-delivery-location",
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify({
                  orderId: orderId,
                  latitude: latitude,
                  longitude: longitude
                })
              }
            );

            const data = await response.json();

            if (!response.ok) {

              console.error(
                "GPS API Error:",
                data
              );

              statusBox.innerHTML += `
                <div class="error">
                  ❌ Server update failed
                </div>
              `;

              return;
            }

            console.log(
              "GPS updated successfully:",
              data
            );

          } catch (error) {

            console.error(
              "GPS update error:",
              error
            );

            statusBox.innerHTML += `
              <div class="error">
                ❌ Internet/server connection failed
              </div>
            `;
          }

        },

        function(error) {

          startBtn.disabled = false;

          let message =
            "Unable to get GPS location.";

          if (error.code === 1) {
            message =
              "GPS permission denied. Please allow location access.";
          }

          if (error.code === 2) {
            message =
              "GPS location unavailable.";
          }

          if (error.code === 3) {
            message =
              "GPS request timed out.";
          }

          statusBox.innerHTML =
            `<span class="error">❌ ${message}</span>`;

        },

        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 15000
        }

      );

    }

  </script>

</body>
</html>
