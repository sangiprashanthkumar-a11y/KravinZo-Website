<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KravinZo | Live Order Tracking</title>

  <!-- Leaflet Map -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      padding: 20px;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    .header {
      background: #111;
      color: white;
      padding: 22px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin-bottom: 6px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .order-id {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }

    .status-title {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .message {
      color: #555;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .tracking-step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 10px;
      border-left: 4px solid #ddd;
      margin-bottom: 8px;
      color: #888;
    }

    .tracking-step span {
      font-size: 22px;
    }

    .tracking-step.completed {
      border-left-color: #20a464;
      color: #20a464;
    }

    .tracking-step.active {
      border-left-color: #ff6600;
      color: #ff6600;
      background: #fff7f0;
      border-radius: 8px;
    }

    .gps-box {
      margin-top: 20px;
      background: #f1f8ff;
      border: 1px solid #cfe7ff;
      border-radius: 14px;
      padding: 15px;
    }

    .gps-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .gps-status {
      font-weight: bold;
      color: #159447;
      margin-bottom: 12px;
    }

    .map-container {
      width: 100%;
      height: 360px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ddd;
      background: #ddd;
    }

    #liveMap {
      width: 100%;
      height: 100%;
    }

    .gps-data {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.8;
      color: #444;
    }

    .map-button {
      display: block;
      margin-top: 12px;
      padding: 12px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
    }

    .waiting {
      background: #fff8df;
      border: 1px solid #f0d77b;
      color: #705900;
      padding: 14px;
      border-radius: 10px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #c00;
      padding: 18px;
      border-radius: 12px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .order-again {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #ff6600;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 20px 0;
    }

    /* Scooter marker */
    .scooter-marker {
      font-size: 38px;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
    }

    .live-badge {
      background: white;
      border: 2px solid #20a464;
      color: #159447;
      padding: 5px 9px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
  </style>

</head>

<body>

  <div class="container">

```
<div class="header">
  <h1>🚴 KravinZo</h1>
  <p>Live Order Tracking</p>
</div>

<div class="card">

  <div id="orderId" class="order-id">
    Loading order...
  </div>

  <div id="orderStatus">
    <div class="loading">
      🔄 Loading order status...
    </div>
  </div>

</div>
```

  </div>

  <!-- Leaflet JS -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>

    let refreshTimer = null;

    let map = null;

    let scooterMarker = null;

    let firstMapLoad = true;


    /* =========================================
       GET ORDER ID FROM URL
    ========================================= */

    function getOrderId() {

      const params =
        new URLSearchParams(window.location.search);

      return params.get("orderId");

    }


    /* =========================================
       CREATE SCOOTER ICON
    ========================================= */

    function createScooterIcon() {

      return L.divIcon({

        className: "",

        html: `
          <div class="scooter-marker">
            🛵
          </div>
        `,

        iconSize: [45, 45],

        iconAnchor: [22, 22]

      });

    }


    /* =========================================
       CREATE / UPDATE MAP
    ========================================= */

    function updateLiveMap(latitude, longitude) {

      const lat =
        Number(latitude);

      const lng =
        Number(longitude);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        return;

      }


      /* First time */

      if (!map) {

        map =
          L.map("liveMap", {
            zoomControl: true
          }).setView(
            [lat, lng],
            16
          );


        L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            maxZoom: 19,
            attribution:
              "&copy; OpenStreetMap contributors"
          }
        ).addTo(map);


        scooterMarker =
          L.marker(
            [lat, lng],
            {
              icon:
                createScooterIcon()
            }
          ).addTo(map);


        scooterMarker.bindTooltip(
          "🛵 Delivery Boy • LIVE",
          {
            permanent: true,
            direction: "top",
            offset: [0, -22],
            className: "live-badge"
          }
        );


        firstMapLoad = false;

        return;

      }


      /* Existing marker */

      const oldPosition =
        scooterMarker.getLatLng();


      const newPosition =
        L.latLng(lat, lng);


      scooterMarker.setLatLng(
        newPosition
      );


      /*
        Move map smoothly only when
        delivery boy changes location.
      */

      if (
        oldPosition.lat !== lat ||
        oldPosition.lng !== lng
      ) {

        map.panTo(
          newPosition,
          {
            animate: true,
            duration: 1
          }
        );

      }

    }


    /* =========================================
       LOAD ORDER
    ========================================= */

    async function loadOrderStatus() {

      const orderId =
        getOrderId();


      const orderIdElement =
        document.getElementById(
          "orderId"
        );


      const statusElement =
        document.getElementById(
          "orderStatus"
        );


      if (!orderId) {

        statusElement.innerHTML = `

          <div class="error">

            ❌ <strong>Order ID missing</strong>

            <p style="margin-top:8px;">
              Please check your tracking link.
            </p>

          </div>

        `;

        return;

      }


      orderIdElement.innerText =
        "Order ID: " + orderId;


      try {

        const response =
          await fetch(
            "/api/get-order-status?orderId=" +
            encodeURIComponent(orderId) +
            "&t=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        let data;


        try {

          data =
            await response.json();

        }
        catch (jsonError) {

          throw new Error(
            "Invalid server response"
          );

        }


        if (
          !response.ok ||
          !data.success
        ) {

          statusElement.innerHTML = `

            <div class="error">

              ❌ <strong>Unable to load order</strong>

              <p style="margin-top:8px;">
                ${
                  data.error ||
                  "Please try again."
                }
              </p>

              <p style="margin-top:8px;">
                Order ID: ${orderId}
              </p>

            </div>

          `;

          return;

        }


        const order =
          data.order;


        const currentStatus =
          order.status || "New";


        /* =====================================
           ORDER STEPS
        ===================================== */

        const steps = [

          {
            status: "New",
            icon: "📦",
            text: "Order Received"
          },

          {
            status: "Preparing Food",
            icon: "🍳",
            text: "Preparing Food"
          },

          {
            status: "Food Ready",
            icon: "✅",
            text: "Food Ready"
          },

          {
            status: "Handed to Delivery",
            icon: "🛵",
            text: "Handed to Delivery"
          },

          {
            status: "Delivered",
            icon: "🎉",
            text: "Delivered"
          }

        ];


        const currentIndex =
          steps.findIndex(
            step =>
              step.status ===
              currentStatus
          );


        const trackingHTML =
          steps.map(
            (step, index) => {

              let className =
                "tracking-step";


              if (
                index < currentIndex
              ) {

                className +=
                  " completed";

              }
              else if (
                index === currentIndex
              ) {

                className +=
                  " active";

              }


              return `

                <div
                  class="${className}"
                >

                  <span>
                    ${step.icon}
                  </span>

                  <strong>
                    ${step.text}
                  </strong>

                </div>

              `;

            }
          ).join("");


        /* =====================================
           STATUS MESSAGE
        ===================================== */

        let message =
          "📝 Your order has been received.";


        if (
          currentStatus ===
          "Preparing Food"
        ) {

          message =
            "👨‍🍳 Your food is being prepared.";

        }

        else if (
          currentStatus ===
          "Food Ready"
        ) {

          message =
            "🍱 Your food is ready!";

        }

        else if (
          currentStatus ===
          "Handed to Delivery"
        ) {

          message =
            "🛵 Your order is on the way.";

        }

        else if (
          currentStatus ===
          "Delivered"
        ) {

          message =
            "🎉 Your order has been delivered!";

        }


        /* =====================================
           GPS DATA
        ===================================== */

        const latitude =
          order.delivery_latitude;

        const longitude =
          order.delivery_longitude;

        const updatedAt =
          order.delivery_location_updated_at;


        const hasGPS =
          latitude !== null &&
          latitude !== undefined &&
          longitude !== null &&
          longitude !== undefined;


        let gpsHTML = "";


        if (hasGPS) {

          let updateText =
            "Just now";


          if (updatedAt) {

            const date =
              new Date(updatedAt);


            updateText =
              date.toLocaleTimeString(
                "en-IN",
                {
                  hour: "2-digit",
                  minute: "2-digit",
                  second: "2-digit"
                }
              );

          }


          const googleMapsURL =
            "https://www.google.com/maps?q=" +
            encodeURIComponent(
              latitude +
              "," +
              longitude
            );


          gpsHTML = `

            <div class="gps-box">

              <div class="gps-title">
                🟢 Live Delivery Tracking
              </div>

              <div class="gps-status">
                🛵 Delivery Boy is moving
              </div>

              <div class="map-container">

                <div id="liveMap"></div>

              </div>

              <div class="gps-data">

                <div>
                  <strong>📍 Location:</strong>
                  Live
                </div>

                <div>
                  <strong>🕐 Last Update:</strong>
                  ${updateText}
                </div>

              </div>

              <a
                class="map-button"
                href="${googleMapsURL}"
                target="_blank"
                rel="noopener noreferrer"
              >
                📍 Open Google Maps
              </a>

            </div>

          `;

        }

        else {

          gpsHTML = `

            <div class="waiting">

              🟡 <strong>GPS Tracking Waiting</strong>

              <p style="margin-top:6px;">
                🛵 Delivery boy location will appear
                here when delivery tracking starts.
              </p>

            </div>

          `;

        }


        /* =====================================
           FINAL PAGE
        ===================================== */

        statusElement.innerHTML = `

          <div>

            <h2 class="status-title">
              Order #${order.order_id}
            </h2>

            <p>
              <strong>Total:</strong>
              ₹${order.total}
            </p>

            <p style="margin-top:8px;">

              <strong>Status:</strong>
              ${currentStatus}

            </p>

            <p class="message">
              ${message}
            </p>

            <hr>

            ${trackingHTML}

            ${gpsHTML}

            ${
              currentStatus ===
              "Delivered"
              ? `
                <button
                  class="order-again"
                  onclick="window.location.href='/'"
                >
                  🍔 Order Again
                </button>
              `
              : ""
            }

          </div>

        `;


        /* =====================================
           MAP UPDATE
        ===================================== */

        if (hasGPS) {

          setTimeout(
            function () {

              updateLiveMap(
                latitude,
                longitude
              );

            },
            100
          );

        }

      }
      catch (error) {

        console.error(
          "TRACKING ERROR:",
          error
        );


        statusElement.innerHTML = `

          <div class="error">

            ❌ <strong>Unable to load order status</strong>

            <p style="margin-top:8px;">
              ${error.message}
            </p>

          </div>

        `;

      }

    }


    /* =========================================
       START PAGE
    ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        loadOrderStatus();


        /*
          Every 5 seconds:
          - Order status refresh
          - GPS location refresh
          - Scooter marker movement
        */

        refreshTimer =
          setInterval(
            loadOrderStatus,
            5000
          );

      }
    );


    /* =========================================
       STOP REFRESH
    ========================================= */

    window.addEventListener(
      "beforeunload",
      function () {

        if (refreshTimer) {

          clearInterval(
            refreshTimer
          );

        }

      }
    );

  </script>

</body>
</html>
