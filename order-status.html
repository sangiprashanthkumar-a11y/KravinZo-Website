<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KravinZo | Live Order Tracking</title>

  <!-- Leaflet Map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    .header {
      background: #111;
      color: white;
      border-radius: 16px;
      padding: 24px 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .order-id {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .status {
      padding: 14px;
      border-radius: 10px;
      background: #fff7d6;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .gps {
      padding: 14px;
      border-radius: 10px;
      background: #e9fff0;
      margin-bottom: 15px;
    }

    .gps-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .location-row {
      margin: 6px 0;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: 380px;
      border-radius: 14px;
      margin-top: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .map-button {
      background: #111;
      color: white;
    }

    .refresh-button {
      background: #eee;
      color: #111;
    }

    .error {
      background: #ffecec;
      color: #d60000;
      border: 1px solid #ffbcbc;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
    }

    .loading {
      color: #666;
      text-align: center;
      padding: 15px;
    }

    .success {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🚴 KravinZo</div>
    <div class="subtitle">Live Order Tracking</div>
  </div>

  <div class="card">

    <div id="loading" class="loading">
      Loading order...
    </div>

    <div id="errorBox" style="display:none;"></div>

    <div id="orderContent" style="display:none;">

      <div class="order-id">
        Order ID:
        <span id="orderIdText"></span>
      </div>

      <div class="status">
        📦 Order Status:
        <span id="statusText"></span>
      </div>

      <div>
        Customer:
        <strong id="customerName"></strong>
      </div>

      <div style="margin-top:8px;">
        Total:
        <strong>₹<span id="totalAmount"></span></strong>
      </div>

      <div class="gps" style="margin-top:18px;">

        <div class="gps-title">
          🛵 Delivery Boy Live Location
        </div>

        <div id="gpsStatus" class="success">
          🟢 GPS Tracking Active
        </div>

        <div class="location-row">
          Latitude:
          <strong id="latitude">--</strong>
        </div>

        <div class="location-row">
          Longitude:
          <strong id="longitude">--</strong>
        </div>

        <div class="location-row">
          Last Update:
          <strong id="lastUpdate">--</strong>
        </div>

      </div>

      <div id="map"></div>

      <button
        id="googleMapsButton"
        class="map-button"
        onclick="openGoogleMaps()"
        style="display:none;"
      >
        📍 Open Delivery Boy Location
      </button>

      <button
        class="refresh-button"
        onclick="loadOrder()"
      >
        🔄 Refresh Now
      </button>

    </div>

  </div>

</div>


<!-- Leaflet -->
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

  let map = null;
  let deliveryMarker = null;

  let currentLatitude = null;
  let currentLongitude = null;


  // -----------------------------------
  // GET ORDER ID FROM URL
  // -----------------------------------

  const params = new URLSearchParams(
    window.location.search
  );

  const orderId = params.get("orderId");


  // -----------------------------------
  // SHOW ERROR
  // -----------------------------------

  function showError(message) {

    document.getElementById("loading").style.display =
      "none";

    document.getElementById("orderContent").style.display =
      "none";

    const errorBox =
      document.getElementById("errorBox");

    errorBox.style.display = "block";

    errorBox.className = "error";

    errorBox.innerHTML =
      "❌ " + message;
  }


  // -----------------------------------
  // CHECK ORDER ID
  // -----------------------------------

  if (!orderId) {

    showError(
      "Order ID missing. Please check your tracking link."
    );

  }


  // -----------------------------------
  // LOAD ORDER
  // -----------------------------------

  async function loadOrder() {

    if (!orderId) {
      return;
    }

    try {

      const response = await fetch(
        "/api/get-order-status?orderId=" +
        encodeURIComponent(orderId) +
        "&t=" +
        Date.now()
      );

      const text = await response.text();

      let result;

      try {

        result = JSON.parse(text);

      } catch (e) {

        console.error(
          "Invalid API response:",
          text
        );

        showError(
          "Invalid server response"
        );

        return;
      }


      if (!response.ok || !result.success) {

        showError(
          result.error ||
          "Unable to load order status"
        );

        return;
      }


      const order = result.order;


      document.getElementById("loading")
        .style.display = "none";

      document.getElementById("errorBox")
        .style.display = "none";

      document.getElementById("orderContent")
        .style.display = "block";


      document.getElementById("orderIdText")
        .textContent =
        order.order_id || orderId;


      document.getElementById("customerName")
        .textContent =
        order.customer_name || "-";


      document.getElementById("totalAmount")
        .textContent =
        order.total || "0";


      document.getElementById("statusText")
        .textContent =
        order.status || "New";


      // -----------------------------------
      // DELIVERY GPS
      // -----------------------------------

      if (
        order.delivery_latitude != null &&
        order.delivery_longitude != null
      ) {

        currentLatitude =
          Number(order.delivery_latitude);

        currentLongitude =
          Number(order.delivery_longitude);


        document.getElementById("latitude")
          .textContent =
          currentLatitude.toFixed(6);


        document.getElementById("longitude")
          .textContent =
          currentLongitude.toFixed(6);


        if (order.delivery_location_updated_at) {

          const date =
            new Date(
              order.delivery_location_updated_at
            );

          document.getElementById("lastUpdate")
            .textContent =
            date.toLocaleTimeString(
              "en-IN"
            );

        }


        document.getElementById("gpsStatus")
          .textContent =
          "🟢 GPS Tracking Active";


        document.getElementById("googleMapsButton")
          .style.display =
          "block";


        updateMap(
          currentLatitude,
          currentLongitude
        );

      } else {

        document.getElementById("gpsStatus")
          .textContent =
          "🟡 Waiting for delivery boy GPS";

        document.getElementById("latitude")
          .textContent = "--";

        document.getElementById("longitude")
          .textContent = "--";

        document.getElementById("lastUpdate")
          .textContent = "--";

      }

    } catch (error) {

      console.error(
        "TRACKING ERROR:",
        error
      );

      showError(
        "Unable to connect to server"
      );
    }
  }


  // -----------------------------------
  // MAP
  // -----------------------------------

  function updateMap(latitude, longitude) {

    if (!map) {

      map = L.map("map").setView(
        [latitude, longitude],
        16
      );


      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution:
            "&copy; OpenStreetMap"
        }
      ).addTo(map);


      const scooterIcon =
        L.divIcon({
          className: "",
          html:
            '<div style="' +
            'font-size:38px;' +
            'text-align:center;' +
            'filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));' +
            '">🛵</div>',
          iconSize: [40, 40],
          iconAnchor: [20, 20]
        });


      deliveryMarker =
        L.marker(
          [latitude, longitude],
          {
            icon: scooterIcon
          }
        ).addTo(map);


      deliveryMarker.bindPopup(
        "🛵 KravinZo Delivery Boy"
      );

    } else {

      deliveryMarker.setLatLng(
        [latitude, longitude]
      );

      map.panTo(
        [latitude, longitude]
      );

    }
  }


  // -----------------------------------
  // GOOGLE MAPS
  // -----------------------------------

  function openGoogleMaps() {

    if (
      currentLatitude == null ||
      currentLongitude == null
    ) {
      return;
    }


    const url =
      "https://www.google.com/maps?q=" +
      currentLatitude +
      "," +
      currentLongitude;


    window.open(
      url,
      "_blank"
    );
  }


  // -----------------------------------
  // START
  // -----------------------------------

  if (orderId) {

    loadOrder();

    // Live refresh every 5 seconds
    setInterval(
      loadOrder,
      5000
    );
  }

</script>

</body>
</html>
