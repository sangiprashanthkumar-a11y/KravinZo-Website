<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KravinZo | Order Tracking</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #171717;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px 7%;
      text-align: center;
    }

    .logo {
      color: #ff6b00;
      font-size: 32px;
      font-weight: 800;
    }

    .tracking-container {
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
    }

    .tracking-card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
    }

    .title span {
      color: #ff6b00;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .title h1 {
      margin-top: 8px;
      font-size: 32px;
    }

    .order-id {
      background: #fff4eb;
      border: 1px solid #ffd2b5;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 30px;
    }

    .order-id small {
      display: block;
      color: #777;
      margin-bottom: 6px;
    }

    .order-id strong {
      color: #ff6b00;
      font-size: 18px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 18px;
      border-bottom: 1px solid #eee;
      color: #999;
      font-weight: bold;
    }

    .status:last-child {
      border-bottom: 0;
    }

    .status-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .status.active {
      color: #111;
    }

    .status.active .status-icon {
      background: #ff6b00;
      color: white;
    }

    .status.completed {
      color: #222;
    }

    .status.completed .status-icon {
      background: #25a244;
      color: white;
    }

    #loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    #error {
      text-align: center;
      padding: 30px;
      color: #d00;
      display: none;
    }

    .back-btn {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    @media(max-width:600px) {
      .tracking-container {
        margin: 25px auto;
        padding: 15px;
      }

      .tracking-card {
        padding: 20px;
      }

      .title h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">KravinZo</div>
</header>

<div class="tracking-container">

  <div class="tracking-card">

    <div class="title">
      <span>YOUR ORDER</span>
      <h1>Track Your Order</h1>
    </div>

    <div id="loading">
      🔄 Loading your order...
    </div>

    <div id="error">
      ❌<br><br>
      <strong>Order Not Found</strong>
      <br><br>
      Please check your order link.
    </div>

    <div id="orderContent" style="display:none;">

      <div class="order-id">
        <small>Order ID</small>
        <strong id="orderIdDisplay"></strong>
      </div>

      <div id="statuses">

        <div class="status" id="statusNew">
          <div class="status-icon">🆕</div>
          <span>Order Received</span>
        </div>

        <div class="status" id="statusPreparing">
          <div class="status-icon">🍳</div>
          <span>Preparing Food</span>
        </div>

        <div class="status" id="statusReady">
          <div class="status-icon">✅</div>
          <span>Food Ready</span>
        </div>

        <div class="status" id="statusDelivery">
          <div class="status-icon">🛵</div>
          <span>Handed to Delivery</span>
        </div>

        <div class="status" id="statusDelivered">
          <div class="status-icon">🎉</div>
          <span>Delivered</span>
        </div>

      </div>

      <button
        class="back-btn"
        onclick="window.location.href='/'"
      >
        🏠 Back to KravinZo
      </button>

    </div>

  </div>

</div>


<script>

const params = new URLSearchParams(
  window.location.search
);

const orderId =
  params.get("orderId");


console.log("Tracking Order ID:", orderId);


const loading =
  document.getElementById("loading");

const error =
  document.getElementById("error");

const orderContent =
  document.getElementById("orderContent");

const orderIdDisplay =
  document.getElementById("orderIdDisplay");


/* =========================
   CHECK ORDER ID
========================= */

if (!orderId) {

  loading.style.display = "none";
  error.style.display = "block";

} else {

  orderIdDisplay.innerText = orderId;

  loadOrder();

}


/* =========================
   LOAD ORDER
========================= */

async function loadOrder() {

  try {

    const response =
      await fetch(
        "/api/get-order-status?orderId=" +
        encodeURIComponent(orderId)
      );


    const text =
      await response.text();


    console.log(
      "API RESPONSE:",
      text
    );


    let data;


    try {

      data =
        JSON.parse(text);

    } catch (e) {

      throw new Error(
        "Invalid server response"
      );

    }


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Order not found"
      );

    }


    loading.style.display = "none";

    error.style.display = "none";

    orderContent.style.display =
      "block";


    updateStatus(
      data.status
    );


  } catch (err) {

    console.error(
      "TRACKING ERROR:",
      err
    );

    loading.style.display = "none";

    error.style.display = "block";

  }

}


/* =========================
   UPDATE STATUS
========================= */

function updateStatus(status) {

  const statuses = {

    "New": 1,

    "Preparing Food": 2,

    "Food Ready": 3,

    "Handed to Delivery": 4,

    "Delivered": 5

  };


  const current =
    statuses[status] || 1;


  const elements = [

    document.getElementById(
      "statusNew"
    ),

    document.getElementById(
      "statusPreparing"
    ),

    document.getElementById(
      "statusReady"
    ),

    document.getElementById(
      "statusDelivery"
    ),

    document.getElementById(
      "statusDelivered"
    )

  ];


  elements.forEach(
    function(element, index) {

      const step =
        index + 1;


      element.classList.remove(
        "active",
        "completed"
      );


      if (step < current) {

        element.classList.add(
          "completed"
        );

      }


      if (step === current) {

        element.classList.add(
          "active"
        );

      }

    }
  );

}


/* =========================
   AUTO REFRESH
========================= */

setInterval(
  loadOrder,
  15000
);

</script>

</body>
</html>
