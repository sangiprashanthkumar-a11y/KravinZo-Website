<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KravinZo | Order Tracking</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .header {
      background: #111;
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin-bottom: 6px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .order-id {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .status-title {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .message {
      color: #555;
      margin-bottom: 20px;
    }

    .tracking-step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 10px;
      border-left: 4px solid #ddd;
      margin-bottom: 8px;
      color: #888;
    }

    .tracking-step span {
      font-size: 22px;
    }

    .tracking-step.completed {
      border-left-color: #20a464;
      color: #20a464;
    }

    .tracking-step.active {
      border-left-color: #ff6600;
      color: #ff6600;
      background: #fff7f0;
      border-radius: 8px;
    }

    .gps-box {
      background: #f1f8ff;
      border: 1px solid #cfe7ff;
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
    }

    .gps-box h3 {
      margin-bottom: 10px;
    }

    .gps-status {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .gps-data {
      font-size: 14px;
      line-height: 1.8;
      color: #444;
    }

    .map-button {
      display: inline-block;
      margin-top: 12px;
      padding: 11px 16px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .order-again {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #ff6600;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #c00;
      padding: 18px;
      border-radius: 12px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 20px 0;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🚴 KravinZo</h1>
      <p>Live Order Tracking</p>
    </div>

    <div class="card">

      <div id="orderId" class="order-id">
        Loading order...
      </div>

      <div id="orderStatus">
        <div class="loading">
          🔄 Loading order status...
        </div>
      </div>

    </div>

  </div>


<script>

let statusInterval = null;


/* ================================
   LOAD ORDER STATUS
================================ */

async function loadOrderStatus() {

  const params = new URLSearchParams(window.location.search);

  const orderId = params.get("orderId");

  const orderIdElement =
    document.getElementById("orderId");

  const statusElement =
    document.getElementById("orderStatus");


  if (!orderId) {

    statusElement.innerHTML = `
      <div class="error">

        ❌ <strong>Order ID missing</strong>

        <p style="margin-top:8px;">
          Please check your order tracking link.
        </p>

      </div>
    `;

    return;
  }


  orderIdElement.innerText =
    "Order ID: " + orderId;


  try {

    const response = await fetch(
      "/api/get-order-status?orderId=" +
      encodeURIComponent(orderId) +
      "&t=" +
      Date.now(),
      {
        cache: "no-store"
      }
    );


    const data = await response.json();


    if (!response.ok || !data.success) {

      statusElement.innerHTML = `
        <div class="error">

          ❌ <strong>Order Not Found</strong>

          <p style="margin-top:8px;">
            Please check your order ID.
          </p>

          <p style="margin-top:8px;">
            Order ID: ${orderId}
          </p>

        </div>
      `;

      return;
    }


    const order = data.order;


    const currentStatus =
      order.status || "New";


    /* ================================
       ORDER STATUS STEPS
    ================================= */

    const steps = [

      {
        status: "New",
        icon: "📦",
        text: "Order Received"
      },

      {
        status: "Preparing Food",
        icon: "🍳",
        text: "Preparing Food"
      },

      {
        status: "Food Ready",
        icon: "✅",
        text: "Food Ready"
      },

      {
        status: "Handed to Delivery",
        icon: "🛵",
        text: "Handed to Delivery"
      },

      {
        status: "Delivered",
        icon: "🎉",
        text: "Delivered"
      }

    ];


    const currentIndex =
      steps.findIndex(
        step =>
          step.status === currentStatus
      );


    const trackingHTML =
      steps.map(
        (step, index) => {

          let className =
            "tracking-step";


          if (index < currentIndex) {

            className +=
              " completed";

          }
          else if (index === currentIndex) {

            className +=
              " active";

          }


          return `

            <div class="${className}">

              <span>
                ${step.icon}
              </span>

              <strong>
                ${step.text}
              </strong>

            </div>

          `;

        }
      ).join("");


    /* ================================
       STATUS MESSAGE
    ================================= */

    let message = "";


    if (currentStatus === "New") {

      message =
        "📝 Your order has been received.";

    }
    else if (
      currentStatus === "Preparing Food"
    ) {

      message =
        "👨‍🍳 Your food is being prepared.";

    }
    else if (
      currentStatus === "Food Ready"
    ) {

      message =
        "🍱 Your food is ready!";

    }
    else if (
      currentStatus === "Handed to Delivery"
    ) {

      message =
        "🛵 Your order is on the way.";

    }
    else if (
      currentStatus === "Delivered"
    ) {

      message =
        "🎉 Your order has been delivered!";

    }


    /* ================================
       GPS DATA
    ================================= */

    const latitude =
      order.delivery_latitude;

    const longitude =
      order.delivery_longitude;


    const accuracy =
      order.delivery_accuracy;


    const updatedAt =
      order.delivery_location_updated_at;


    let gpsHTML = "";


    if (
      latitude !== null &&
      latitude !== undefined &&
      longitude !== null &&
      longitude !== undefined
    ) {

      const googleMapsURL =
        "https://www.google.com/maps?q=" +
        encodeURIComponent(
          latitude + "," + longitude
        );


      let updateText = "";


      if (updatedAt) {

        const date =
          new Date(updatedAt);

        updateText =
          date.toLocaleTimeString(
            "en-IN",
            {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            }
          );

      }


      gpsHTML = `

        <div class="gps-box">

          <h3>
            🟢 GPS Tracking Active
          </h3>

          <div class="gps-status">
            📍 Delivery Boy Location
          </div>

          <div class="gps-data">

            <div>
              <strong>Latitude:</strong>
              ${latitude}
            </div>

            <div>
              <strong>Longitude:</strong>
              ${longitude}
            </div>

            ${
              accuracy
              ? `
                <div>
                  <strong>Accuracy:</strong>
                  ${accuracy} meters
                </div>
              `
              : ""
            }

            ${
              updateText
              ? `
                <div>
                  <strong>Last Update:</strong>
                  ${updateText}
                </div>
              `
              : ""
            }

          </div>

          <a
            class="map-button"
            href="${googleMapsURL}"
            target="_blank"
            rel="noopener"
          >
            📍 Open Live Location
          </a>

        </div>

      `;

    }
    else {

      gpsHTML = `

        <div class="gps-box">

          <h3>
            🟡 GPS Tracking
          </h3>

          <p>
            Delivery boy location will appear
            when GPS tracking starts.
          </p>

        </div>

      `;

    }


    /* ================================
       FINAL HTML
    ================================= */

    statusElement.innerHTML = `

      <div>

        <h2 class="status-title">
          Order #${order.order_id}
        </h2>


        <p>
          <strong>Total:</strong>
          ₹${order.total}
        </p>


        <p style="margin-top:8px;">

          <strong>Status:</strong>

          <span>
            ${currentStatus}
          </span>

        </p>


        <p class="message"
           style="margin-top:10px;">

          ${message}

        </p>


        <hr>


        <div>

          ${trackingHTML}

        </div>


        ${gpsHTML}


        ${
          currentStatus === "Delivered"

          ? `

            <button
              class="order-again"
              onclick="window.location.href='/'"
            >
              🍔 Order Again
            </button>

          `

          : ""

        }

      </div>

    `;

  }


  catch (error) {

    console.error(
      "TRACKING ERROR:",
      error
    );


    statusElement.innerHTML = `

      <div class="error">

        ❌ Unable to load order status.

        <p style="margin-top:8px;">
          Please try again.
        </p>

      </div>

    `;

  }

}


/* ================================
   PAGE LOAD
================================ */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    loadOrderStatus();


    /*
      Refresh every 5 seconds
      so customer gets latest status
      and GPS location.
    */

    statusInterval =
      setInterval(
        loadOrderStatus,
        5000
      );

  }
);


/* ================================
   STOP REFRESH
================================ */

window.addEventListener(
  "beforeunload",
  function () {

    if (statusInterval) {

      clearInterval(
        statusInterval
      );

    }

  }
);

</script>

</body>
</html>
