
<script>
let statusInterval = null;

async function loadOrderStatus() {

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("orderId");

  const orderIdElement = document.getElementById("orderId");
  const statusElement = document.getElementById("orderStatus");

  if (!orderId) {
    statusElement.innerHTML = `
      <div class="error">
        ❌ <strong>Order ID missing</strong>
        <p>Please check your order link.</p>
      </div>
    `;
    return;
  }

  if (orderIdElement) {
    orderIdElement.innerText = orderId;
  }

  try {

    const response = await fetch(
      "/api/get-order-status?orderId=" +
      encodeURIComponent(orderId) +
      "&t=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {

      statusElement.innerHTML = `
        <div class="error">
          ❌ <strong>Order Not Found</strong>
          <p>Please check your order link.</p>
          <p>Order ID: ${orderId}</p>
        </div>
      `;

      return;
    }

    const order = data.order;

    const currentStatus = order.status || "New";

    const steps = [
      {
        status: "New",
        icon: "📦",
        text: "Order Received"
      },
      {
        status: "Preparing Food",
        icon: "🍳",
        text: "Preparing Food"
      },
      {
        status: "Food Ready",
        icon: "✅",
        text: "Food Ready"
      },
      {
        status: "Handed to Delivery",
        icon: "🛵",
        text: "Handed to Delivery"
      },
      {
        status: "Delivered",
        icon: "🎉",
        text: "Delivered"
      }
    ];

    const currentIndex = steps.findIndex(
      step => step.status === currentStatus
    );

    const trackingHTML = steps.map((step, index) => {

      let className = "tracking-step";

      if (index < currentIndex) {
        className += " completed";
      } else if (index === currentIndex) {
        className += " active";
      }

      return `
        <div class="${className}">
          <span>${step.icon}</span>
          <strong>${step.text}</strong>
        </div>
      `;

    }).join("");

    let message = "";

    if (currentStatus === "New") {
      message = "📝 Your order has been received.";
    } else if (currentStatus === "Preparing Food") {
      message = "👨‍🍳 Your food is being prepared.";
    } else if (currentStatus === "Food Ready") {
      message = "🍱 Your food is ready!";
    } else if (currentStatus === "Handed to Delivery") {
      message = "🛵 Your order is on the way.";
    } else if (currentStatus === "Delivered") {
      message = "🎉 Your order has been delivered!";
    }

    statusElement.innerHTML = `
      <div class="success">

        <h2>Order #${order.order_id}</h2>

        <p>Total: ₹${order.total}</p>

        <p>
          Status:
          <strong>${currentStatus}</strong>
        </p>

        <p>${message}</p>

        <hr>

        ${trackingHTML}

        ${
          currentStatus === "Delivered"
            ? `
              <button
                onclick="window.location.href='/'"
                style="
                  margin-top:20px;
                  padding:12px 20px;
                  border:none;
                  border-radius:8px;
                  cursor:pointer;
                "
              >
                🍔 Order Again
              </button>
            `
            : ""
        }

      </div>
    `;

  } catch (error) {

    console.error("TRACKING ERROR:", error);

    statusElement.innerHTML = `
      <div class="error">
        ❌ Unable to load order status.
        <p>Please try again.</p>
      </div>
    `;
  }
}


document.addEventListener(
  "DOMContentLoaded",
  function () {

    loadOrderStatus();

    // Refresh status every 5 seconds
    statusInterval = setInterval(
      loadOrderStatus,
      5000
    );

  }
);


// Stop refresh when page is closed
window.addEventListener(
  "beforeunload",
  function () {

    if (statusInterval) {
      clearInterval(statusInterval);
    }

  }
);
</script>
