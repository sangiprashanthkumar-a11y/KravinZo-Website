<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KravinZo - Order Status</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }


    body {
      background: #f5f5f5;
      min-height: 100vh;
      padding: 20px;
    }


    .container {
      max-width: 600px;
      margin: 25px auto;
    }


    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 25px;
    }


    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }


    h1 {
      text-align: center;
      margin-bottom: 8px;
    }


    .order-id {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
      word-break: break-all;
    }


    .status-box {
      text-align: center;
      padding: 25px;
      border-radius: 15px;
      background: #f7f7f7;
      margin-bottom: 25px;
    }


    .status-icon {
      font-size: 52px;
      margin-bottom: 10px;
    }


    .status-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }


    .status-message {
      color: #555;
      font-size: 15px;
      line-height: 1.5;
    }


    .steps {
      margin-top: 10px;
    }


    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }


    .step:last-child {
      border-bottom: none;
    }


    .step-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }


    .step.active .step-icon {
      background: #111;
      color: white;
    }


    .step.completed .step-icon {
      background: #2e7d32;
      color: white;
    }


    .step-text {
      font-weight: bold;
    }


    .delivered-box {
      text-align: center;
      background: #f1fff4;
      border-radius: 15px;
      padding: 30px 20px;
      margin-top: 25px;
    }


    .delivered-box .big-icon {
      font-size: 55px;
    }


    .delivered-box h2 {
      color: #2e7d32;
      margin: 10px 0;
    }


    .delivered-box p {
      color: #444;
      line-height: 1.6;
      margin-bottom: 8px;
    }


    .order-again-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 28px;
      border: none;
      border-radius: 9px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }


    .order-again-btn:hover {
      opacity: 0.85;
    }


    .loading {
      text-align: center;
      padding: 20px;
      color: #555;
    }


    .error {
      text-align: center;
      padding: 20px;
      color: red;
    }

  </style>

</head>


<body>


  <div class="container">


    <!-- LOGO -->

    <div class="logo">
      🍔 KravinZo
    </div>


    <div class="card">


      <!-- TITLE -->

      <h1>
        Your Order
      </h1>


      <div
        id="orderId"
        class="order-id"
      >
        Loading order...
      </div>


      <!-- CURRENT STATUS -->

      <div
        id="statusBox"
        class="status-box"
      >

        <div
          id="statusIcon"
          class="status-icon"
        >
          ⏳
        </div>


        <div
          id="statusTitle"
          class="status-title"
        >
          Loading...
        </div>


        <div
          id="statusMessage"
          class="status-message"
        >
          Please wait...
        </div>

      </div>


      <!-- STATUS STEPS -->

      <div class="steps">


        <!-- PREPARING -->

        <div
          id="stepPreparing"
          class="step"
        >

          <div class="step-icon">
            🍳
          </div>

          <div class="step-text">
            Preparing Food
          </div>

        </div>


        <!-- READY -->

        <div
          id="stepReady"
          class="step"
        >

          <div class="step-icon">
            ✅
          </div>

          <div class="step-text">
            Food Ready
          </div>

        </div>


        <!-- DELIVERY -->

        <div
          id="stepDelivery"
          class="step"
        >

          <div class="step-icon">
            🛵
          </div>

          <div class="step-text">
            Handed to Delivery
          </div>

        </div>


        <!-- DELIVERED -->

        <div
          id="stepDelivered"
          class="step"
        >

          <div class="step-icon">
            🎉
          </div>

          <div class="step-text">
            Delivered
          </div>

        </div>

      </div>


      <!-- DELIVERED MESSAGE -->

      <div
        id="deliveredBox"
        class="delivered-box"
        style="display:none;"
      >

        <div class="big-icon">
          🎉
        </div>


        <h2>
          Order Delivered!
        </h2>


        <p>
          Thank you for ordering from
          <strong>KravinZo</strong> ❤️
        </p>


        <p>
          Your order has been delivered successfully.
        </p>


        <a
          href="/"
          class="order-again-btn"
        >
          🍔 Order Again
        </a>

      </div>


    </div>

  </div>



  <script>


    // ==========================================
    // GET ORDER ID
    // ==========================================

    const params =
      new URLSearchParams(
        window.location.search
      );


    let orderId =
      params.get("orderId") ||
      params.get("order_id") ||
      params.get("id") ||
      localStorage.getItem(
        "kravinzoOrderId"
      );


    // ==========================================
    // SAVE ORDER ID
    // ==========================================

    if (orderId) {

      orderId =
        String(orderId).trim();


      localStorage.setItem(
        "kravinzoOrderId",
        orderId
      );

    }


    // ==========================================
    // ELEMENTS
    // ==========================================

    const orderIdElement =
      document.getElementById(
        "orderId"
      );


    const statusBox =
      document.getElementById(
        "statusBox"
      );


    const statusIcon =
      document.getElementById(
        "statusIcon"
      );


    const statusTitle =
      document.getElementById(
        "statusTitle"
      );


    const statusMessage =
      document.getElementById(
        "statusMessage"
      );


    const deliveredBox =
      document.getElementById(
        "deliveredBox"
      );


    const stepPreparing =
      document.getElementById(
        "stepPreparing"
      );


    const stepReady =
      document.getElementById(
        "stepReady"
      );


    const stepDelivery =
      document.getElementById(
        "stepDelivery"
      );


    const stepDelivered =
      document.getElementById(
        "stepDelivered"
      );


    // ==========================================
    // NO ORDER ID
    // ==========================================

    if (!orderId) {

      orderIdElement.textContent =
        "Order ID missing";


      statusIcon.textContent =
        "❌";


      statusTitle.textContent =
        "Order Not Found";


      statusMessage.textContent =
        "Please open the order tracking link again.";


    }


    // ==========================================
    // RESET STEPS
    // ==========================================

    function resetSteps() {

      const steps = [
        stepPreparing,
        stepReady,
        stepDelivery,
        stepDelivered
      ];


      steps.forEach(step => {

        step.classList.remove(
          "active",
          "completed"
        );

      });

    }


    // ==========================================
    // UPDATE STEPS
    // ==========================================

    function updateSteps(status) {

      resetSteps();


      // NEW

      if (
        status === "New" ||
        status === "pending" ||
        status === "Order Confirmed"
      ) {

        stepPreparing.classList.add(
          "active"
        );

      }


      // PREPARING

      else if (
        status === "Preparing Food"
      ) {

        stepPreparing.classList.add(
          "active"
        );

      }


      // FOOD READY

      else if (
        status === "Food Ready"
      ) {

        stepPreparing.classList.add(
          "completed"
        );

        stepReady.classList.add(
          "active"
        );

      }


      // HANDED TO DELIVERY

      else if (
        status === "Handed to Delivery"
      ) {

        stepPreparing.classList.add(
          "completed"
        );

        stepReady.classList.add(
          "completed"
        );

        stepDelivery.classList.add(
          "active"
        );

      }


      // DELIVERED

      else if (
        status === "Delivered"
      ) {

        stepPreparing.classList.add(
          "completed"
        );

        stepReady.classList.add(
          "completed"
        );

        stepDelivery.classList.add(
          "completed"
        );

        stepDelivered.classList.add(
          "completed"
        );

      }

    }


    // ==========================================
    // DISPLAY STATUS
    // ==========================================

    function displayStatus(status) {

      status =
        String(status || "New").trim();


      // ORDER ID

      orderIdElement.textContent =
        "Order #" + orderId;


      // STEPS

      updateSteps(status);


      // ========================================
      // NEW
      // ========================================

      if (
        status === "New" ||
        status === "pending" ||
        status === "Order Confirmed"
      ) {

        statusIcon.textContent =
          "🕐";


        statusTitle.textContent =
          "Order Confirmed";


        statusMessage.textContent =
          "Your order has been confirmed. Our kitchen will start preparing your food.";


        statusBox.style.background =
          "#fff8e1";


        deliveredBox.style.display =
          "none";

      }


      // ========================================
      // PREPARING
      // ========================================

      else if (
        status === "Preparing Food"
      ) {

        statusIcon.textContent =
          "🍳";


        statusTitle.textContent =
          "Preparing Your Food";


        statusMessage.textContent =
          "Our kitchen is preparing your order. Please wait.";


        statusBox.style.background =
          "#fff3e0";


        deliveredBox.style.display =
          "none";

      }


      // ========================================
      // FOOD READY
      // ========================================

      else if (
        status === "Food Ready"
      ) {

        statusIcon.textContent =
          "✅";


        statusTitle.textContent =
          "Food Ready";


        statusMessage.textContent =
          "Your food is ready and waiting for delivery.";


        statusBox.style.background =
          "#e8f5e9";


        deliveredBox.style.display =
          "none";

      }


      // ========================================
      // HANDED TO DELIVERY
      // ========================================

      else if (
        status === "Handed to Delivery"
      ) {

        statusIcon.textContent =
          "🛵";


        statusTitle.textContent =
          "Out for Delivery";


        statusMessage.textContent =
          "Your order has been handed to the delivery partner and is on the way.";


        statusBox.style.background =
          "#e3f2fd";


        deliveredBox.style.display =
          "none";

      }


      // ========================================
      // DELIVERED
      // ========================================

      else if (
        status === "Delivered"
      ) {

        statusIcon.textContent =
          "🎉";


        statusTitle.textContent =
          "Order Delivered!";


        statusMessage.textContent =
          "Your order has been delivered successfully.";


        statusBox.style.background =
          "#e8f5e9";


        deliveredBox.style.display =
          "block";

      }


      // ========================================
      // UNKNOWN STATUS
      // ========================================

      else {

        statusIcon.textContent =
          "📦";


        statusTitle.textContent =
          status;


        statusMessage.textContent =
          "Your order status has been updated.";


        deliveredBox.style.display =
          "none";

      }

    }


    // ==========================================
    // LOAD ORDER
    // ==========================================

    async function loadOrderStatus() {

      if (!orderId) {
        return;
      }


      try {

        const response =
          await fetch(
            "/api/get-order-status?orderId=" +
            encodeURIComponent(orderId),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        const responseText =
          await response.text();


        console.log(
          "ORDER STATUS API:",
          response.status
        );


        console.log(
          "ORDER STATUS RESPONSE:",
          responseText
        );


        let data;


        try {

          data =
            JSON.parse(responseText);

        } catch (error) {

          console.error(
            "Invalid JSON:",
            responseText
          );


          statusIcon.textContent =
            "❌";


          statusTitle.textContent =
            "Server Error";


          statusMessage.textContent =
            "Unable to load order status.";

          return;

        }


        // ======================================
        // API ERROR
        // ======================================

        if (!response.ok) {

          statusIcon.textContent =
            "❌";


          statusTitle.textContent =
            "Order Not Found";


          statusMessage.textContent =
            data.error ||
            "Unable to find this order.";

          return;

        }


        // ======================================
        // SUCCESS CHECK
        // ======================================

        if (!data.success) {

          statusIcon.textContent =
            "❌";


          statusTitle.textContent =
            "Unable to Load Order";


          statusMessage.textContent =
            data.error ||
            "Please try again.";

          return;

        }


        // ======================================
        // GET ORDER
        // ======================================

        const order =
          data.order ||
          data.data ||
          data;


        const status =
          order.status ||
          "New";


        // ======================================
        // DISPLAY
        // ======================================

        displayStatus(status);

      }


      catch (error) {

        console.error(
          "Order status error:",
          error
        );


        statusIcon.textContent =
          "❌";


        statusTitle.textContent =
          "Connection Error";


        statusMessage.textContent =
          "Please check your internet connection.";

      }

    }


    // ==========================================
    // FIRST LOAD
    // ==========================================

    loadOrderStatus();


    // ==========================================
    // AUTO REFRESH
    // ==========================================

    setInterval(
      loadOrderStatus,
      10000
    );


  </script>


</body>
</html>
