<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KravinZo - Food Order</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .cart {
      font-size: 16px;
      background: white;
      color: #111;
      padding: 8px 14px;
      border-radius: 20px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
    }

    .food {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }

    .food:last-child {
      border-bottom: none;
    }

    .food-name {
      font-size: 17px;
      font-weight: bold;
    }

    .price {
      color: #e63946;
      margin-top: 5px;
    }

    .add-btn {
      background: #111;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    textarea {
      height: 80px;
      resize: none;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty button {
      width: 28px;
      height: 28px;
      border: none;
      background: #111;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .total {
      border-top: 1px solid #ddd;
      margin-top: 15px;
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
    }

    .payment-btn {
      width: 100%;
      padding: 15px;
      background: #111;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .payment-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cod-btn {
      width: 100%;
      padding: 15px;
      background: #eee;
      color: #111;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 15px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">KravinZo</div>

  <div class="cart">
    Cart: <span id="cartCount">0</span>
  </div>
</header>


<div class="container">

  <!-- FOOD MENU -->

  <div class="card">

    <h2>Menu</h2>

    <div class="food">

      <div>
        <div class="food-name">Classic Burger</div>
        <div class="price">₹199</div>
      </div>

      <button
        class="add-btn"
        onclick="addToCart('Classic Burger', 199)"
      >
        Add
      </button>

    </div>


    <div class="food">

      <div>
        <div class="food-name">Peri Peri Fries</div>
        <div class="price">₹149</div>
      </div>

      <button
        class="add-btn"
        onclick="addToCart('Peri Peri Fries', 149)"
      >
        Add
      </button>

    </div>


    <div class="food">

      <div>
        <div class="food-name">French Fries</div>
        <div class="price">₹129</div>
      </div>

      <button
        class="add-btn"
        onclick="addToCart('French Fries', 129)"
      >
        Add
      </button>

    </div>

  </div>


  <!-- CART -->

  <div class="card">

    <h2>Your Cart</h2>

    <div id="cartItems">

      <div class="empty">
        Your cart is empty
      </div>

    </div>

    <div class="total">

      <span>Total</span>

      <span>
        ₹<span id="totalAmount">0</span>
      </span>

    </div>

  </div>


  <!-- DELIVERY -->

  <div class="card">

    <h2>Delivery Details</h2>

    <input
      type="text"
      id="customerName"
      placeholder="Your Name"
    >

    <input
      type="tel"
      id="customerPhone"
      placeholder="Phone Number"
    >

    <textarea
      id="customerAddress"
      placeholder="Delivery Address"
    ></textarea>

  </div>


  <!-- PAYMENT -->

  <div class="card">

    <h2>Payment</h2>

    <button
      id="payButton"
      class="payment-btn"
      onclick="payOnline()"
    >
      Pay Online
    </button>

    <button
      class="cod-btn"
      onclick="cashOnDelivery()"
    >
      Cash on Delivery
    </button>

    <div id="message"></div>

  </div>

</div>


<script>

  // =====================================
  // RAZORPAY KEY ID
  // =====================================

  const RAZORPAY_KEY_ID =
    "YOUR_RAZORPAY_KEY_ID";


  // =====================================
  // CART
  // =====================================

  let cart = [];


  // =====================================
  // ADD TO CART
  // =====================================

  function addToCart(name, price) {

    const existingItem =
      cart.find(item => item.name === name);


    if (existingItem) {

      existingItem.quantity++;

    } else {

      cart.push({

        name: name,

        price: price,

        quantity: 1

      });

    }


    updateCart();

  }


  // =====================================
  // INCREASE
  // =====================================

  function increaseQuantity(index) {

    cart[index].quantity++;

    updateCart();

  }


  // =====================================
  // DECREASE
  // =====================================

  function decreaseQuantity(index) {

    cart[index].quantity--;


    if (cart[index].quantity <= 0) {

      cart.splice(index, 1);

    }


    updateCart();

  }


  // =====================================
  // UPDATE CART
  // =====================================

  function updateCart() {

    const cartItems =
      document.getElementById("cartItems");

    const cartCount =
      document.getElementById("cartCount");

    const totalAmount =
      document.getElementById("totalAmount");


    cartItems.innerHTML = "";


    if (cart.length === 0) {

      cartItems.innerHTML =
        '<div class="empty">Your cart is empty</div>';

      cartCount.innerText = "0";

      totalAmount.innerText = "0";

      return;

    }


    let total = 0;

    let count = 0;


    cart.forEach((item, index) => {

      total +=
        item.price * item.quantity;

      count += item.quantity;


      const div =
        document.createElement("div");

      div.className = "cart-item";


      div.innerHTML = `

        <div>

          <strong>${item.name}</strong>

          <br>

          ₹${item.price} × ${item.quantity}

        </div>


        <div class="qty">

          <button
            onclick="decreaseQuantity(${index})"
          >
            -
          </button>

          <span>
            ${item.quantity}
          </span>

          <button
            onclick="increaseQuantity(${index})"
          >
            +
          </button>

        </div>

      `;


      cartItems.appendChild(div);

    });


    cartCount.innerText = count;

    totalAmount.innerText = total;

  }


  // =====================================
  // GET TOTAL
  // =====================================

  function getTotal() {

    return cart.reduce(

      (total, item) => {

        return total +
          item.price * item.quantity;

      },

      0

    );

  }


  // =====================================
  // ONLINE PAYMENT
  // =====================================

  async function payOnline() {

    const name =
      document
        .getElementById("customerName")
        .value
        .trim();


    const phone =
      document
        .getElementById("customerPhone")
        .value
        .trim();


    const address =
      document
        .getElementById("customerAddress")
        .value
        .trim();


    const message =
      document.getElementById("message");


    const payButton =
      document.getElementById("payButton");


    // CHECK CART

    if (cart.length === 0) {

      alert("Please add items to cart.");

      return;

    }


    // CHECK NAME

    if (!name) {

      alert("Please enter your name.");

      return;

    }


    // CHECK PHONE

    if (!phone) {

      alert("Please enter your phone number.");

      return;

    }


    // CHECK ADDRESS

    if (!address) {

      alert("Please enter your delivery address.");

      return;

    }


    const total = getTotal();


    if (total <= 0) {

      alert("Invalid order amount.");

      return;

    }


    payButton.disabled = true;

    payButton.innerText =
      "Creating Payment...";


    message.innerText = "";


    try {

      // =================================
      // CREATE RAZORPAY ORDER
      // =================================

      const response =
        await fetch(
          "/api/create-order",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              amount: total

            })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Payment order creation failed"
        );

      }


      // =================================
      // RAZORPAY OPTIONS
      // =================================

      const options = {

        key:
          RAZORPAY_KEY_ID,

        amount:
          data.amount,

        currency:
          "INR",

        name:
          "KravinZo",

        description:
          "KravinZo Food Order",

        order_id:
          data.id,


        prefill: {

          name:
            name,

          contact:
            phone

        },


        notes: {

          address:
            address

        },


        theme: {

          color:
            "#111111"

        },


        handler:
          function(response) {

            message.innerText =
              "Payment successful!";

            alert(
              "Payment successful!\n\n" +
              "Payment ID: " +
              response.razorpay_payment_id
            );

          },


        modal: {

          ondismiss:
            function() {

              payButton.disabled =
                false;

              payButton.innerText =
                "Pay Online";

              message.innerText =
                "Payment cancelled.";

            }

        }

      };


      // =================================
      // OPEN RAZORPAY
      // =================================

      const razorpay =
        new Razorpay(options);


      razorpay.on(
        "payment.failed",
        function(response) {

          console.log(
            response.error
          );


          payButton.disabled =
            false;

          payButton.innerText =
            "Pay Online";


          message.innerText =
            "Payment failed. Please try again.";

        }
      );


      razorpay.open();


    } catch (error) {

      console.error(error);


      alert(
        error.message ||
        "Something went wrong."
      );


      payButton.disabled =
        false;


      payButton.innerText =
        "Pay Online";

    }

  }


  // =====================================
  // CASH ON DELIVERY
  // =====================================

  function cashOnDelivery() {

    const name =
      document
        .getElementById("customerName")
        .value
        .trim();


    const phone =
      document
        .getElementById("customerPhone")
        .value
        .trim();


    const address =
      document
        .getElementById("customerAddress")
        .value
        .trim();


    if (cart.length === 0) {

      alert(
        "Please add items to cart."
      );

      return;

    }


    if (!name) {

      alert(
        "Please enter your name."
      );

      return;

    }


    if (!phone) {

      alert(
        "Please enter your phone number."
      );

      return;

    }


    if (!address) {

      alert(
        "Please enter your delivery address."
      );

      return;

    }


    alert(
      "Order placed successfully!\n\n" +
      "Payment: Cash on Delivery"
    );

  }


  // =====================================
  // INITIAL CART
  // =====================================

  updateCart();

</script>

</body>
</html>
